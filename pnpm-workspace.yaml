allowBuilds:
  "@google/genai": true
  "@sentry/cli": true
  core-js: false
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

overrides:
  # CodeMirror extensions must share the same state/view instances.
  "@codemirror/state": 6.7.1
  "@codemirror/view": 6.43.6
  postcss: 8.5.23
  sharp: 0.35.4

minimumReleaseAgeExclude:
  - lucide-react@1.25.0
  - postcss@8.5.23
  - js-yaml@5.2.2
  - prettier@3.9.7

patchedDependencies:
  "@opennextjs/cloudflare@1.20.6": patches/@opennextjs__cloudflare@1.20.6.patch
